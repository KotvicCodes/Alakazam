name: Tests
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm test
    browser:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium --no-shell
            - run: npm run test:game:fetch
            - run: npm run test:integration
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-failures
                  path: test-results/
                  retention-days: 7
